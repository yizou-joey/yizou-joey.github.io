<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found | Yi ZOU</title>
    <meta name="author" content="Yi ZOU" />
    <meta
      name="description"
      content="Page not found. Return to Yi ZOU's homepage or publications."
    />
    <meta property="og:title" content="404 Not Found | Yi ZOU" />
    <meta
      property="og:description"
      content="The page cannot be found. Navigate back to the homepage of Yi ZOU."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="files/favicon.svg"
      type="image/svg+xml"
      data-dynamic-favicon
      data-active-icon="files/favicon.svg"
      data-idle-icon="files/favicon-idle.svg"
      data-active-light-icon="files/favicon.svg"
      data-idle-light-icon="files/favicon-idle.svg"
      data-active-dark-icon="files/favicon-light.svg"
      data-idle-dark-icon="files/favicon-idle-light.svg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="text-ink">
    <div class="site-shell">
      <div class="site-page-stack site-page-stack--screen">
        <header class="site-header">
          <div class="site-header-frame">
            <div class="site-header-inner">
              <div class="site-header-brand">
                <span class="type-brand text-ink">Yi</span>
              </div>
              <nav class="site-header-nav type-nav">
                <a href="index.html" class="site-header-link">About</a>
                <a href="publications.html" class="site-header-link">Publications</a>
              </nav>
            </div>
          </div>
          <div class="site-header-rule"></div>
        </header>

        <main class="error404-main" aria-labelledby="error404-title">
          <section class="error404-shell page-gutter">
            <article class="error404-container">
              <p class="error404-kicker type-label text-muted">Page Not Found</p>
              <p class="error404-display" aria-hidden="true">404</p>
              <h1 id="error404-title" class="error404-title type-title-page">
                This page has moved or no longer exists.
              </h1>
              <p class="error404-copy type-body text-muted">
                The link may be outdated, or the page may have moved. You can return to the homepage or go back to continue browsing.
              </p>
              <div class="error404-actions">
                <a href="index.html" class="error404-link">Take me home</a>
                <span class="publication-eyebrow-separator">/</span>
                <a href="index.html" id="error404-back" class="error404-link">Go back</a>
              </div>
            </article>
          </section>
        </main>
        <footer class="site-footer" data-site-footer="true">
          <div class="site-footer-inner">
            <p class="site-footer-note">© 2026 Yi ZOU. Powered by GitHub Pages.</p>
          </div>
        </footer>
      </div>
    </div>
    <script
      data-goatcounter="https://joeyzou.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
    <script type="module" src="js/favicon.js"></script>
  </body>
</html>
