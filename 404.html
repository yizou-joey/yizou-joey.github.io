<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- site:bootstrap -->
    <title>404 Not Found | Yi Zou</title>
    <meta name="author" content="Yi Zou" />
    <meta
      name="description"
      content="Page not found. Return to Yi Zou's homepage."
    />
    <meta property="og:title" content="404 Not Found | Yi Zou" />
    <meta
      property="og:description"
      content="The page cannot be found. Navigate back to the homepage of Yi Zou."
    />
    <meta property="og:type" content="website" />
    <!-- site:head -->
  </head>
  <body class="text-ink">
    <div class="site-shell">
      <div class="site-page-stack site-page-stack--screen">
        <!-- site:header -->

        <main
          class="error404-main"
          aria-labelledby="error404-title"
          aria-describedby="error404-message"
        >
          <section class="error404-shell page-gutter">
            <article class="error404-container">
              <p class="error404-kicker type-label text-muted">Page Not Found</p>
              <h1 id="error404-title" class="error404-display">404</h1>
              <p id="error404-message" class="error404-copy type-body-bio">
                This page may have moved or no longer exists.
              </p>
              <nav class="error404-actions" aria-label="Error recovery">
                <a href="/" class="error404-link">Take me home</a>
                <span class="error404-separator" aria-hidden="true">/</span>
                <a href="/" id="error404-back" class="error404-link">Go back</a>
              </nav>
            </article>
          </section>
        </main>
        <!-- site:footer -->
      </div>
    </div>
    <script
      data-goatcounter="https://joeyzou.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
    <script type="module" src="js/404.js"></script>
    <script type="module" src="js/favicon.js"></script>
  </body>
</html>
