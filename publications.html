<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yi Zou - Publications</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
    <body class="bg-white text-ink">
    <div class="relative size-full">
      <div class="flex flex-col items-center section-gap w-full">
        <header class="w-full">
          <div class="bg-white flex w-full items-center justify-center">
            <div class="flex w-[1440px] max-w-full flex-col items-center gap-3 px-4 py-3 md:h-[50px] md:flex-row md:justify-between md:gap-6 md:py-0">
              <div class="flex w-[24px] items-center justify-center">
                <span class="font-serifSc text-[24px] text-ink">Yi</span>
              </div>
              <nav class="flex w-full flex-wrap items-center justify-center gap-x-6 gap-y-2 font-inter text-[12px] text-muted sm:text-[14px] md:w-auto md:gap-[32px] md:text-[15px]">
                <a href="index.html" class="hover:text-ink">About</a>
                <a href="publications.html" class="font-semibold text-ink">Publications</a>
              </nav>
            </div>
          </div>
          <div class="h-px w-full bg-line"></div>
          <!-- <div class="h-[200px] w-full bg-gradient-to-b from-[#f7f6f3] via-[#e9e7e3] to-[#d3d1cb]"></div> -->
        </header>

        <section class="w-full max-w-[1000px] px-4">
          <div class="flex w-full items-center p-[10px]">
            <h1 class="font-inter text-[30px] font-semibold leading-[32px] sm:text-[36px] md:text-[40px]">
              Publications
            </h1>
          </div>
        </section>

        <section class="w-full bg-stone section-py">
          <div class="mx-auto flex w-full max-w-[1000px] flex-col items-center gap-[30px] px-4">
            <div class="publication-toolbar card-surface w-full rounded-xl p-4 sm:p-5">
              <div class="publication-toolbar-row publication-toolbar-row-top">
                <div
                  id="publication-view-toggle"
                  class="inline-flex w-fit items-center rounded-[8px] border border-line bg-white p-1"
                  role="tablist"
                  aria-label="Publication view"
                >
                  <button type="button" class="publication-toggle-btn is-active" data-view="list">
                    Table
                  </button>
                  <button type="button" class="publication-toggle-btn" data-view="cards">
                    Cards
                  </button>
                </div>
                <p id="publications-summary" class="publication-toolbar-summary font-inter text-[14px] text-muted">
                  Loading publication summary...
                </p>
              </div>
              <div class="mt-3 flex flex-col gap-3">
                <div class="publication-toolbar-row publication-toolbar-row-bottom">
                  <div id="publication-type-filters" class="flex flex-wrap items-center gap-2">
                    <button type="button" class="publication-filter-btn is-active" data-type="ALL">All</button>
                    <button type="button" class="publication-filter-btn" data-type="C">C</button>
                    <button type="button" class="publication-filter-btn" data-type="J">J</button>
                    <button type="button" class="publication-filter-btn" data-type="W">W</button>
                    <button type="button" class="publication-filter-btn" data-type="P">P</button>
                  </div>
                  <div class="publication-toolbar-search-actions">
                    <div class="publication-search-wrap">
                      <input
                        id="publication-search-input"
                        class="publication-search-input"
                        type="search"
                        placeholder="Search"
                        aria-label="Search publications"
                      />
                    </div>
                    <div class="publication-filter-actions">
                      <button id="publication-more-filters" type="button" class="publication-filter-btn">
                        Filters
                      </button>
                      <button id="publication-clear-filters" type="button" class="publication-filter-btn">
                        Reset
                      </button>
                    </div>
                  </div>
                </div>
                <div id="publication-advanced-filters" class="publication-advanced-filters is-collapsed">
                  <div class="publication-attribute-filters">
                    <label class="publication-select-label">
                      <span>Year</span>
                      <select id="publication-year-filter" class="publication-select">
                        <option value="ALL">All years</option>
                      </select>
                    </label>
                    <label class="publication-select-label">
                      <span>Venue</span>
                      <select id="publication-venue-filter" class="publication-select">
                        <option value="ALL">All venues</option>
                      </select>
                    </label>
                  </div>
                </div>
              </div>
            </div>
            <div id="publications-structured-list" class="flex w-full flex-col gap-[14px]"></div>
            <div id="publications-by-year" class="hidden w-full flex-col gap-[32px]"></div>
          </div>
        </section>
      </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/publications.js"></script>

    <script
      data-goatcounter="https://joeyzou.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </body>
</html>
