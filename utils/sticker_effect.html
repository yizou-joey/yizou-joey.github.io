<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sticker Border Effect</title>
  <style>
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      color: #eee;
      gap: 32px;
    }
    h1 { font-size: 1.4rem; letter-spacing: 0.05em; opacity: 0.8; margin: 0; }
    .row {
      display: flex;
      gap: 48px;
      align-items: flex-end;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .label {
      font-size: 0.85rem;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    canvas, img.original { max-width: 380px; }
    .controls {
      display: flex;
      gap: 24px;
      align-items: center;
      background: rgba(255,255,255,0.07);
      padding: 16px 28px;
      border-radius: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .drop-zone {
      border: 2px dashed rgba(255,255,255,0.3);
      border-radius: 12px;
      padding: 20px 32px;
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.7;
      transition: border-color 0.2s, opacity 0.2s;
      cursor: pointer;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #FDF2D5;
      opacity: 1;
    }
    .ctrl-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      opacity: 0.8;
    }
    input[type=range] { width: 120px; cursor: pointer; }
    button {
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
    }
    #renderBtn   { background: #4e9af1; }
    #renderBtn:hover  { background: #3a7bd5; }
    #downloadBtn { background: #27ae60; }
    #downloadBtn:hover { background: #1e8449; }
    #status {
      font-size: 0.78rem;
      opacity: 0.55;
      min-height: 1.2em;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>🦦 Sticker Border Effect — Alpha Dilation</h1>

<div class="controls">
  <div class="ctrl-group">
    <label>Dilation Radius: <span id="radiusVal">30</span>px</label>
    <input type="range" id="radiusSlider" min="4" max="40" value="30" />
  </div>
  <div class="ctrl-group">
    <label>Edge Smoothing: <span id="smoothVal">2</span></label>
    <input type="range" id="smoothSlider" min="0" max="5" step="0.5" value="2" />
  </div>
  <div class="ctrl-group">
    <label>Border Color</label>
    <input type="color" id="colorPicker" value="#FDF2D5"
           style="cursor:pointer;width:60px;height:32px;border:none;background:none;" />
  </div>
  <button id="renderBtn" onclick="scheduleRender()">Re-render</button>
  <button id="downloadBtn" onclick="download()">⬇ Download PNG</button>
</div>

<p id="status"></p>

<div class="row">
  <div class="card">
    <span class="label">Original</span>
    <div id="dropZone" class="drop-zone">
      🖼️ Drop image here or click to browse
    </div>
    <img id="originalImg" class="original"
         src="Human Computer Interaction.png"
         crossorigin="anonymous" alt="Original mascot"
         style="display:none" />
  </div>
  <div class="card">
    <span class="label">Sticker Output</span>
    <canvas id="stickerCanvas"></canvas>
  </div>
</div>

<canvas id="srcCanvas" style="display:none"></canvas>
<input type="file" id="fileInput" accept="image/*" style="display:none" />

<script>
const WORKER_SRC = `
self.onmessage = function(e) {
  const { srcData, PW, PH, radius, br, bg, bb } = e.data;

  const ALPHA_THRESHOLD = 128;

  const alphaMask = new Uint8Array(PW * PH);
  for (let i = 0; i < PW * PH; i++) {
    if (srcData[i * 4 + 3] >= ALPHA_THRESHOLD) alphaMask[i] = 1;
  }

  const r2 = radius * radius;
  const offsets = [], dxList = [], dyList = [];
  for (let dy = -radius; dy <= radius; dy++) {
    for (let dx = -radius; dx <= radius; dx++) {
      if (dx*dx + dy*dy <= r2) {
        offsets.push(dy * PW + dx);
        dxList.push(dx);
        dyList.push(dy);
      }
    }
  }
  const K = offsets.length;

  const borderMask = new Uint8Array(PW * PH);
  for (let y = radius; y < PH - radius; y++) {
    for (let x = radius; x < PW - radius; x++) {
      const idx = y * PW + x;
      if (alphaMask[idx]) continue;
      for (let k = 0; k < K; k++) {
        if (alphaMask[idx + offsets[k]]) { borderMask[idx] = 1; break; }
      }
    }
  }
  for (let y = 0; y < PH; y++) {
    for (let x = 0; x < PW; x++) {
      if (y >= radius && y < PH - radius && x >= radius && x < PW - radius) continue;
      const idx = y * PW + x;
      if (alphaMask[idx]) continue;
      outer: for (let k = 0; k < K; k++) {
        const nx = x + dxList[k];
        const ny = y + dyList[k];
        if (nx >= 0 && ny >= 0 && nx < PW && ny < PH && alphaMask[ny * PW + nx]) {
          borderMask[idx] = 1; break outer;
        }
      }
    }
  }

  const out = new Uint8ClampedArray(PW * PH * 4);
  for (let i = 0; i < PW * PH; i++) {
    if (borderMask[i] || alphaMask[i]) {
      out[i*4]   = br;
      out[i*4+1] = bg;
      out[i*4+2] = bb;
      out[i*4+3] = 255;
    }
  }
  self.postMessage({ out, PW, PH }, [out.buffer]);
};
`;

const workerBlob = new Blob([WORKER_SRC], { type: 'application/javascript' });
const workerURL  = URL.createObjectURL(workerBlob);
let   worker     = null;
let   renderPending = false;
let   renderTimer   = null;

function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

const img       = document.getElementById('originalImg');
const canvas    = document.getElementById('stickerCanvas');
const ctx       = canvas.getContext('2d');
const srcCanvas = document.getElementById('srcCanvas');
const sc        = srcCanvas.getContext('2d');
const status    = document.getElementById('status');

let cachedSrcData = null;
let cachedPW = 0, cachedPH = 0;
let currentImageName = 'Human Computer Interaction.png';

function ensureSrcCache(PAD) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const PW = W + PAD * 2, PH = H + PAD * 2;
  if (cachedPW === PW && cachedPH === PH) return;
  srcCanvas.width = PW; srcCanvas.height = PH;
  sc.clearRect(0, 0, PW, PH);
  sc.drawImage(img, PAD, PAD);
  cachedSrcData = sc.getImageData(0, 0, PW, PH).data;
  cachedPW = PW; cachedPH = PH;
}

function smoothBorderCanvas(cvs, smooth) {
  const w = cvs.width, h = cvs.height;
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  const tc = tmp.getContext('2d');

  function blurThreshold(src, radius, cutoff) {
    tc.clearRect(0, 0, w, h);
    tc.filter = `blur(${radius}px)`;
    tc.drawImage(src, 0, 0);
    tc.filter = 'none';
    const id = tc.getImageData(0, 0, w, h);
    const d  = id.data;
    for (let i = 3; i < d.length; i += 4) {
      d[i] = d[i] > cutoff ? 255 : 0;
    }
    tc.putImageData(id, 0, 0);
    return tmp;
  }

  const pass1 = blurThreshold(cvs, smooth * 1.2, 60);
  const pass2 = blurThreshold(pass1, smooth * 0.6, 100);

  const outCtx = cvs.getContext('2d');
  outCtx.clearRect(0, 0, w, h);
  outCtx.drawImage(pass2, 0, 0);
}

function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 60);
}

function render() {
  if (renderPending) return;

  const radius = parseInt(document.getElementById('radiusSlider').value);
  const smooth = parseFloat(document.getElementById('smoothSlider').value);
  const [br, bg, bb] = hexToRgb(document.getElementById('colorPicker').value);

  const PAD = radius + 8;
  ensureSrcCache(PAD);
  const PW = cachedPW, PH = cachedPH;

  if (worker) { worker.terminate(); worker = null; }
  worker = new Worker(workerURL);

  renderPending = true;
  status.textContent = '⏳ Rendering…';
  document.getElementById('renderBtn').disabled = true;

  const srcCopy = new Uint8ClampedArray(cachedSrcData);
  worker.postMessage({ srcData: srcCopy, PW, PH, radius, br, bg, bb }, [srcCopy.buffer]);

  worker.onmessage = function(e) {
    const { out, PW: w, PH: h } = e.data;
    worker.terminate(); worker = null;
    renderPending = false;
    document.getElementById('renderBtn').disabled = false;

    const borderCanvas = document.createElement('canvas');
    borderCanvas.width = w; borderCanvas.height = h;
    const bc = borderCanvas.getContext('2d');
    bc.putImageData(new ImageData(new Uint8ClampedArray(out), w, h), 0, 0);

    if (smooth > 0) smoothBorderCanvas(borderCanvas, smooth);

    canvas.width = w; canvas.height = h;

    const borderImg = new ImageData(new Uint8ClampedArray(out), w, h);
    ctx.putImageData(borderImg, 0, 0);

    if (smooth > 0) {
      const tmp = document.createElement('canvas');
      tmp.width = w; tmp.height = h;
      const tc = tmp.getContext('2d');
      tc.filter = `blur(${smooth}px)`;
      tc.drawImage(canvas, 0, 0);
      const td = tc.getImageData(0, 0, w, h);
      const d = td.data;
      for (let i = 3; i < d.length; i += 4) {
        d[i] = d[i] > 80 ? 255 : 0;
      }
      ctx.clearRect(0, 0, w, h);
      tc.putImageData(td, 0, 0);
      ctx.drawImage(tmp, 0, 0);
    }

    ctx.drawImage(srcCanvas, 0, 0);

    status.textContent = '✅ Done';
    setTimeout(() => status.textContent = '', 1500);
  };

  worker.onerror = function(err) {
    console.error(err);
    renderPending = false;
    document.getElementById('renderBtn').disabled = false;
    status.textContent = '❌ Render error — see console';
  };
}

function download() {
  const link = document.createElement('a');
  const nameWithoutExt = currentImageName.replace(/\.[^.]+$/, '');
  const ext = currentImageName.match(/\.([^.]+)$/)?.[1] || 'png';
  link.download = `${nameWithoutExt}_sticker.${ext}`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

document.getElementById('radiusSlider').addEventListener('input', function() {
  document.getElementById('radiusVal').textContent = this.value;
  cachedSrcData = null;
  scheduleRender();
});
document.getElementById('smoothSlider').addEventListener('input', function() {
  document.getElementById('smoothVal').textContent = this.value;
  scheduleRender();
});
document.getElementById('colorPicker').addEventListener('input', scheduleRender);

// Drag and drop functionality
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

function loadImageFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  currentImageName = file.name;
  const reader = new FileReader();
  reader.onload = function(e) {
    img.src = e.target.result;
    img.onload = function() {
      cachedSrcData = null;
      img.style.display = 'block';
      dropZone.textContent = file.name;
      dropZone.style.borderColor = '#FDF2D5';
      render();
    };
  };
  reader.readAsDataURL(file);
}

dropZone.addEventListener('click', () => fileInput.click());

dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('drag-over');
});

dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('drag-over');
});

dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  loadImageFile(file);
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  loadImageFile(file);
});

if (img.complete && img.naturalWidth) { render(); }
else { img.onload = render; }
</script>
</body>
</html>
